[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aaruni-cloud"
version = "1.0.0"
description = "Official Python SDK for Aaruni Cloud — Aaruni Storage (ACS), Compute (ACC), Voice (AVA), Assistant (AAI), and Render (ARN)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Aaruni Tech Private Limited", email = "info@syllovo.com" }
]
license = { text = "MIT" }
keywords = ["aaruni", "aaruni-cloud", "storage", "compute", "voice-ai", "render"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaruni_cloud*"]
