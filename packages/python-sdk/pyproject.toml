[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aarunicloud"
version = "1.0.0"
description = "Official Python SDK for Aaruni Cloud — Cloud Voice, Cloud Storage, Cloud Archive, Cloud Compute, Cloud Assistant, and Cloud Render."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Aaruni Tech Private Limited", email = "info@syllovo.com" }
]
license = { text = "MIT" }
keywords = ["aarunicloud", "acloud", "cloud-voice", "cloud-storage", "cloud-compute", "voice-cloning"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aarunicloud*"]
